<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
	xsi:schemaLocation="http://www.thymeleaf.org ">

<head>
	<th:block th:replace="~{fragments/head :: head}"></th:block>
</head>

<body>
	<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

	<div class="container-fluid align-items-center mt-3 p-3">

		<div class="card w-75 container-fluid bg-light p-4">
			<div class="row text-center m-4">
				<div class="col-12">
					<h2>Gestión de usuarios</h2>
				</div>
			</div>

			<div class="row justify-content-center">
				<div class="col-8">
					<table class="table table-bordered table-hover" id="usuariosTable" style="border: 1px solid #333;">
						<thead class="text-center">
							<tr style="border: 1px solid #333;">
								<th scope="col" style="border: 1px solid #333;">Nombre de usuario</th>
								<th scope="col" style="border: 1px solid #333;">Activo</th>
								<th scope="col" style="border: 1px solid #333;"></th>
							</tr>
						</thead>
						<tbody>
							<tr class="text-center" th:if="${usuarios!=null}" th:each="user : ${usuarios}"
								style="border: 1px solid #333;">
								<td style="border: 1px solid #333;">
									<div class="input-group">
										<input type="text" class="form-control" placeholder="Nombre de usuario" th:value="${user.username}" th:data-user-name="${user.username}" disabled>
										<button class="btn btn-outline-secondary username-edit-btn" type="button"><i class="bi bi-pencil-square"></i></button>
										<button class="btn btn-outline-secondary username-save-btn d-none" type="button"><i class="bi bi-floppy"></i></button>
										<button class="btn btn-outline-secondary username-cancel-btn d-none" type="button"><i class="bi bi-x-lg"></i></button>
									</div>
								</td>
								<td style="border: 1px solid #333;">
									<div
										class="form-check form-switch d-flex align-items-center justify-content-center">
										<input th:checked="${user.enabled}" class="form-check-input user-enabled-switch"
											type="checkbox" role="switch" th:data-user-id="${user.id}">
									</div>
								</td>
								<td style="border: 1px solid #333;"><button type="button"
										class="btn btn-secondary mod-usuario-btn">Cambiar contraseña</button></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<div class="toast-container position-fixed bottom-0 end-0 p-3">
		<div id="liveErrorToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
			<div class="toast-header">
				<strong class="me-auto">Gesau</strong>
				<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
			</div>
			<div class="toast-body" id="errorText"></div>
		</div>
	</div>

	<div id="modificarUsuarioModal" class="modal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Modificar usuario</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div id="changePasswordModalBody" class="modal-body m-4">
					<form id="modificarUsuarioForm">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<div class="row g-3 align-items-center">
							<div class="mb-3">
								<label for="userName" class="form-label">Nombre de usuario</label>
								<div class="input-group">
									<input type="text" class="form-control" placeholder="Recipient’s username"
										aria-label="Recipient’s username with two button addons">
									<button class="btn btn-outline-secondary" type="button"><i class="bi bi-pencil-square"></i></button>
									<button class="btn btn-outline-secondary" type="button"><i class="bi bi-floppy"></i></button>
									<button class="btn btn-outline-secondary" type="button"><i class="bi bi-x-lg"></i></button>
								</div>
							</div>
						</div>
						<div class="row g-3 align-items-center">
							<div class="mb-3">
								<label for="newPassword" class="form-label">Nueva contraseña</label>
								<input type="password" name="newPassword" class="form-control" id="newPassword"
									aria-describedby="newPasswordHelp">
								<div id="newPasswordHelp" class="form-text"></div>
							</div>
						</div>
						<div class="row g-3 align-items-center">
							<div class="mb-3">
								<label for="confirmNewPassword" class="form-label">Confirmar nueva contraseña</label>
								<input type="password" name="confirmPassword" class="form-control"
									id="confirmNewPassword" aria-describedby="confirmNewPasswordHelp">
								<div id="confirmNewPasswordHelp" class="form-text"></div>
							</div>
						</div>
						<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
						<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
					<button type="button" id="changePasswordBtn" class="btn btn-primary">Guardar</button>
				</div>
			</div>
		</div>
	</div>


	<script th:src="@{/js/vendor/jquery-3.7.1.min.js}"></script>
	<script th:src="@{/js/vendor/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/vendor/dataTables.js}"></script>
	<script th:src="@{/js/vendor/dataTables.bootstrap5.js}"></script>
	<script>
		$(document).ready(function () {
			function mostrarToast(mensaje) {
				$('#errorText').text(mensaje);
				const toastElement = document.getElementById('liveErrorToast');
				const toast = bootstrap.Toast.getOrCreateInstance(toastElement);
				toast.show();
			}

			$('#usuariosTable').DataTable({
				language: {
					search: "Buscar:",
					lengthMenu: "Mostrar _MENU_ registros",
					info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
					infoEmpty: "Mostrando 0 a 0 de 0 registros",
					infoFiltered: "(filtrado de _MAX_ registros totales)",
					zeroRecords: "No se encontraron resultados",
					paginate: {
						first: "Primero",
						last: "Último",
						next: "Siguiente",
						previous: "Anterior"
					}
				}
			});

			$('.username-edit-btn').on('click', function(){
				const $inputgroup = $(this).closest('.input-group');
				const $input = $inputgroup.find('input');

				$input.prop(disabled)
				$inputgroup.find('.username-edit-btn').addClass('d-none');
				$inputgroup.find('.username-save-btn').removeClass('d-none');
				$inputgroup.find('.username-cancel-btn').removeClass('d-none');
			});


			$('.username-cancel-btn').on('click', function(){
				const $inputgroup = $(this).closest('.input-group');
				const $input = $inputgroup.find('input');
				$input.val($input.attr('data-user-name'));
				$inputgroup.find('.username-edit-btn').removeClass('d-none');
				$inputgroup.find('.username-save-btn').addClass('d-none');
				$inputgroup.find('.username-cancel-btn').addClass('d-none');
			});



			$('.mod-usuario-btn').on('click',function(){
				$('#modificarUsuarioModal').modal('show');
			});

			$('.user-enabled-switch').on('change', function () {
				const $switch = $(this);
				const userId = $switch.attr('data-user-id');
				const enabled = $switch.is(':checked');

				const csrfToken = $('meta[name="_csrf"]').attr('content');
				const csrfHeader = $('meta[name="_csrf_header"]').attr('content');

				$.ajax({
					url: 'switchEnabledUser',
					type: 'POST',
					data: {
						userId: userId,
						enabled: enabled
					},
					beforeSend: function (xhr) {
						xhr.setRequestHeader(csrfHeader, csrfToken);
					},
					success: function (response) {
						if (response !== "OK") {
							$switch.prop('checked', !enabled);
							mostrarToast(response);
						}
					},
					error: function () {
						$switch.prop('checked', !enabled);
						mostrarToast('Se ha producido un error inesperado');
					}

				});
			});
		});
	</script>
</body>

</html>
